spring.application.name=gestion-visiteurs

# dev = H2 file database (default) ; prod = MySQL, enable with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

spring.security.enabled=false
server.port=8060

# HMAC signing secret for JWT (hashed with SHA-256 in JwtUtil). Set JWT_SECRET outside local dev.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret}
